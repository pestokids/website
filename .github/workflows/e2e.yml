name: e2e

# End-to-end tests against the pull request's Vercel Preview.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The browsers and their system libraries come with the image. Keep its tag
    # on the playwright-core version @e2e-dev/web pins; the check below fails
    # when they drift apart.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: read
      deployments: read
      pull-requests: write
    steps:
      # Setup runs while Vercel is still building the Preview. Check out the
      # head commit, not the merge ref, so the tests match the Preview's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the container has the pinned browsers
        shell: node {0}
        run: |
          const { createRequire } = require('node:module');
          const { existsSync } = require('node:fs');
          const web = createRequire(require.resolve('@e2e-dev/web', { paths: [process.cwd()] }));
          const { chromium, webkit } = web('playwright-core');
          const { version } = web('playwright-core/package.json');
          if (![chromium, webkit].every((browser) => existsSync(browser.executablePath()))) {
            console.log(`::error::@e2e-dev/web runs Playwright ${version}: use the mcr.microsoft.com/playwright:v${version}-noble image`);
            process.exit(1);
          }

      - name: Wait for the Preview of ${{ github.event.pull_request.head.sha }}
        id: preview
        run: node .github/scripts/wait-for-deployment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ENVIRONMENT: preview
          CHECK_PATH: /apply
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Four workers run the test and target pairs side by side (CI defaults to
      # one); every test brings its own data. One rerun of the failed tests
      # catches flakes; the PR comment shows them as flaky.
      - name: Run e2e
        run: pnpm exec e2e run --workers 4 --reporter list,junit || pnpm exec e2e run --workers 4 --last-failed
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
          if-no-files-found: warn
