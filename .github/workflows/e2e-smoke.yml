name: e2e smoke

# Read-only smoke tests against Production after each deploy: the welcome and
# desktop screens only, with no submit. Third-party requests (analytics) are
# blocked by the tests, so real funnels never see this traffic.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

env:
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    steps:
      # Vercel creates a GitHub deployment for the commit; wait for its
      # Production deployment to be ready.
      - name: Wait for the Production deployment
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 120); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=100" \
              --jq '[.[] | select(.environment | test("^production"; "i"))][0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // "pending"')
              echo "Deployment $id: $state"
              case "$state" in
                success) exit 0 ;;
                failure|error|inactive) echo "::error::The Production deployment ended in $state"; exit 1 ;;
              esac
            else
              echo "No Production deployment for $SHA yet"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Production deployment of $SHA"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec e2e-web install chromium webkit --with-deps

      - name: Run smoke tests
        run: pnpm exec e2e run --tag smoke --reporter list,junit || pnpm exec e2e run --last-failed
        env:
          PREVIEW_URL: https://pestokids.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
          if-no-files-found: warn
